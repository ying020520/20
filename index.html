<!doctype html>
<html>

<head>
    <title>MicroProjetAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js">
    </script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script type="module" src="https://raw.githack.com/b2renger/microprojetar/main/lib/qrTunnel.js"></script>

</head>


<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best ; changeMatrixMode: modelViewMatrix;"
        vr-mode-ui="enabled: false"
        renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights; logarithmicDepthBuffer: true;"
        smooth=" true" smoothCount="5" smoothTolerance=".05" smoothThreshold="5" sourceWidth="800" sourceHeight="600"
        displayWidth="1280" displayHeight="720">

        <a-marker type='barcode' value='0'>
            <a-text value="WH" side="double" position="-0.5 0.1 -1" rotation="270 0 0" width="8" color="blue"
                align="center">
            </a-text>
        </a-marker>
        <a-marker type='barcode' value='0'>
            <a-text value="YT" side="double" position="0.5 0.1 -1" rotation="270 0 0" width="8" color="red"
                align="center">
            </a-text>
        </a-marker>
        <a-entity camera></a-entity>
        <a-marker type='barcode' value='0'>
            <a-text value="HAPPY!!" side="double" position="0 0.1 0.7" rotation="270 0 2" width="6" color="BLACK"
                align="center">
            </a-text>


        <a-image src="images-2.png" position="0 0 0.2" rotation="270 0 0" width="1" height="1">
        </a-image>
        </a-marker>

    </a-scene>
</body>
</html>
